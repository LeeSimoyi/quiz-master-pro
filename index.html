<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quiz Master Pro</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- Feedback toast (shared) -->
<div class="feedback-toast" id="toastEl"></div>

<div class="app">
  <div class="screen-wrap">

    <!-- ==============================
         SCREEN 1: LOGIN
    ============================== -->
    <div class="screen active card" id="loginScreen">
      <div class="login-logo">
        <div class="logo-icon"><i class="fas fa-brain"></i></div>
        <h1>Quiz Master Pro</h1>
      </div>
      <p class="login-tagline">Challenge yourself across Web Dev, JavaScript & Python</p>

      <div class="login-stats">
        <div class="stat-chip"><span class="val">3</span><span class="lbl">Categories</span></div>
        <div class="stat-chip"><span class="val">12</span><span class="lbl">Questions</span></div>
        <div class="stat-chip"><span class="val">15s</span><span class="lbl">Per Q</span></div>
      </div>

      <label class="field-label" for="nameInput">Your Name</label>
      <div class="input-wrap">
        <i class="fas fa-user"></i>
        <input type="text" id="nameInput" placeholder="e.g. Alex Johnson" autocomplete="off" maxlength="30">
      </div>

      <label class="field-label">Difficulty</label>
      <div class="diff-row">
        <button class="diff-btn selected" data-diff="easy" onclick="selectDiff(this)"><span class="diff-dot"></span>Easy</button>
        <button class="diff-btn" data-diff="medium" onclick="selectDiff(this)"><span class="diff-dot"></span>Medium</button>
        <button class="diff-btn" data-diff="hard" onclick="selectDiff(this)"><span class="diff-dot"></span>Hard</button>
      </div>

      <button class="btn btn-primary" onclick="startQuiz()">
        <i class="fas fa-play"></i> Start Quiz
      </button>
    </div>

    <!-- ==============================
         SCREEN 2: CATEGORY SELECT
    ============================== -->
    <div class="screen card" id="categoryScreen">
      <p class="screen-title">Pick a Topic</p>
      <p class="screen-sub">Choose a category to test your skills</p>
      <div class="category-grid" id="catGrid"></div>
    </div>

    <!-- ==============================
         SCREEN 3: QUIZ
    ============================== -->
    <div class="screen card" id="quizScreen">
      <!-- Header -->
      <div class="quiz-header">
        <div class="quiz-player">
          <div class="avatar" id="avatarEl">?</div>
          <div>
            <div class="quiz-player-name" id="quizNameEl"></div>
            <div class="quiz-score-live" id="scoreLiveEl">Score: 0</div>
          </div>
        </div>
        <!-- Timer ring -->
        <div class="timer-ring-wrap">
          <svg viewBox="0 0 54 54">
            <circle class="timer-ring-bg" cx="27" cy="27" r="22"></circle>
            <circle class="timer-ring-fill" id="timerRing" cx="27" cy="27" r="22"
              stroke-dasharray="138.2" stroke-dashoffset="0"></circle>
          </svg>
          <span class="timer-num" id="timerNum">15</span>
        </div>
      </div>

      <!-- Progress -->
      <div class="progress-meta">
        <span id="progLabel">Question 1 of 4</span>
        <span id="catNameLabel"></span>
      </div>
      <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>

      <!-- Question -->
      <div class="q-category-badge" id="qBadge"><i class="fas fa-circle-question"></i> <span id="badgeTxt">Question</span></div>
      <p class="question-text" id="questionText"></p>
      <div class="answers" id="answersWrap"></div>

      <!-- Footer nav -->
      <div class="quiz-footer">
        <button class="btn btn-secondary btn-icon btn-sm" id="prevBtn" onclick="prevQuestion()" title="Previous">
          <i class="fas fa-chevron-left"></i>
        </button>
        <div class="quiz-dot-nav" id="dotNav"></div>
        <button class="btn btn-primary btn-icon btn-sm" id="nextBtn" onclick="nextQuestion()" title="Next / Finish">
          <i class="fas fa-chevron-right"></i>
        </button>
      </div>
    </div>

    <!-- ==============================
         SCREEN 4: RESULT
    ============================== -->
    <div class="screen card" id="resultScreen">
      <div class="result-header">
        <span class="result-medal" id="medalEl">🎯</span>
        <h2 class="result-title" id="resultTitle">Well Done!</h2>
        <p class="result-subtitle" id="resultSub"></p>
      </div>

      <!-- Score ring -->
      <div class="score-ring-wrap">
        <svg viewBox="0 0 130 130">
          <circle class="score-ring-bg" cx="65" cy="65" r="55"></circle>
          <circle class="score-ring-fill" id="scoreRing" cx="65" cy="65" r="55"
            stroke-dasharray="345.4" stroke-dashoffset="345.4"></circle>
        </svg>
        <div class="score-ring-label">
          <span class="score-num" id="scoreNum">0</span>
          <span class="score-den" id="scoreDen">/ 4</span>
        </div>
      </div>

      <!-- Stats -->
      <div class="result-stats">
        <div class="res-stat rs-correct"><span class="rs-val" id="resCorrect">0</span><span class="rs-lbl">Correct</span></div>
        <div class="res-stat rs-wrong">  <span class="rs-val" id="resWrong">0</span>  <span class="rs-lbl">Wrong</span></div>
        <div class="res-stat rs-time">   <span class="rs-val" id="resTime">0s</span>  <span class="rs-lbl">Avg Time</span></div>
      </div>

      <!-- Performance badge -->
      <div class="perf-badge" id="perfBadge"></div>

      <!-- Review toggle -->
      <button class="review-toggle" onclick="toggleReview(this)">
        <span><i class="fas fa-list-check" style="margin-right:6px"></i>Review Answers</span>
        <i class="fas fa-chevron-down" id="reviewChevron"></i>
      </button>
      <div class="review-list" id="reviewList"></div>

      <div class="btn-row">
        <button class="btn btn-secondary" onclick="goHome()"><i class="fas fa-house"></i> Home</button>
        <button class="btn btn-primary"   onclick="restartSame()"><i class="fas fa-rotate-right"></i> Retry</button>
      </div>
    </div>

  </div><!-- /screen-wrap -->
</div><!-- /app -->
<script src="script.js"></script>
</body>
</html>
