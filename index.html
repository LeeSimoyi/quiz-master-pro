<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Quiz Master Pro</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="app-wrapper">

<!-- LOGIN -->
<section class="container" id="login-screen">
  <div class="login-header">
    <i class="fas fa-brain icon-large"></i>
    <h1>Quiz Master Pro</h1>
    <p>Test your developer knowledge</p>
  </div>

  <div class="input-group">
    <i class="fas fa-user"></i>
    <input type="text" id="username" placeholder="Enter your name">
  </div>

  <button onclick="startQuiz()">
    <i class="fas fa-play"></i> Start Quiz
  </button>
</section>

<!-- CATEGORY -->
<section class="container hidden" id="category-screen">
  <h2>Select Category</h2>
  <div class="category-grid" id="category-grid"></div>
</section>

<!-- QUIZ -->
<section class="container hidden" id="quiz-screen">

  <div class="top-bar">
    <span id="player-name"></span>

    <div class="timer-box">
      <i class="fas fa-clock"></i>
      <span id="timer">15</span>
    </div>
  </div>

  <div class="progress-bar">
    <div id="progress-fill"></div>
  </div>

  <div class="question-box">
    <p class="question-label">Question</p>
    <h2 id="question"></h2>
  </div>

  <div id="answers" class="answers-container"></div>

  <div class="quiz-controls">
    <button onclick="previousQuestion()">
      <i class="fas fa-arrow-left"></i>
    </button>
    <button onclick="nextQuestion()">
      <i class="fas fa-arrow-right"></i>
    </button>
  </div>

</section>

<!-- RESULT -->
<section class="container hidden" id="result-screen">
  <h2>Quiz Completed</h2>

  <h1 id="final-score"></h1>

  <p id="performance-text" class="performance"></p>

  <button onclick="goHome()">
    <i class="fas fa-home"></i> Home
  </button>

  <button onclick="restartQuiz()">
    <i class="fas fa-rotate"></i> Restart
  </button>
</section>

</div>

<script src="script.js"></script>
</body>
</html>
